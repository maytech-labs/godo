name: Bug report
description: Something doesn't work as documented
body:
  - type: dropdown
    id: crate
    attributes:
      label: Crate
      options:
        - godo
        - clapsmith
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: "godo --version, or the clapsmith version in Cargo.lock"
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
