name: Release godo

# Push a tag like godo-v0.1.0 to build the godo binary for each platform and
# publish it as a GitHub release, with checksums and the version's section of
# crates/godo/CHANGELOG.md as notes, then point the Homebrew formula at it.
# Tag main's latest commit; the prepare job sets crates/godo's version from
# the tag and commits it. clapsmith is released separately, with its own tags.
#
# Run it by hand (Actions → Release godo → Run workflow) for a dry run: it
# checks, builds, and packages every target at the current version, and
# uploads the archives as workflow artifacts. It doesn't commit, release, or
# touch the tap.

on:
  push:
    tags: ["godo-v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  MANIFEST: crates/godo/Cargo.toml
  CHANGELOG: crates/godo/CHANGELOG.md

jobs:
  # On a tag: turns it into a release commit on main. Sets the version, dates
  # the changelog's Unreleased section, commits, and moves the tag onto that
  # commit. A tag already at a commit with its version is built as it is.
  # On a dry run: names the build after the current version.
  prepare:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
      tag: ${{ steps.commit.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: "1.98.1"
      - name: Commit the release
        id: commit
        run: |
          current=$(sed -n 's/^version = "\(.*\)"/\1/p' "$MANIFEST" | head -1)
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            echo "dry run of godo $current at $GITHUB_SHA"
            echo "sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
            echo "tag=godo-v$current" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          version="${GITHUB_REF_NAME#godo-v}"
          echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          # The tag as it is now: a rerun finds it already moved.
          git fetch --quiet --force origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          tag_sha=$(git rev-parse "$GITHUB_REF_NAME^{commit}")
          git checkout --quiet "$tag_sha"
          current=$(sed -n 's/^version = "\(.*\)"/\1/p' "$MANIFEST" | head -1)
          if [ "$current" = "$version" ]; then
            echo "sha=$tag_sha" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$(git rev-parse origin/main)" != "$tag_sha" ]; then
            echo "$GITHUB_REF_NAME isn't on main's latest commit; delete it and tag main"
            exit 1
          fi
          notes=$(awk '/^## / { if (found) exit; if ($0 == "## Unreleased") { found = 1; next } } found && NF' "$CHANGELOG")
          test -n "$notes" || { echo "$CHANGELOG's Unreleased section is empty"; exit 1; }
          git switch --quiet main
          sed -i "0,/^version = \"$current\"/s//version = \"$version\"/" "$MANIFEST"
          cargo update --workspace
          sed -i "s/^## Unreleased$/## Unreleased\n\n## $version - $(date -u +%F)/" "$CHANGELOG"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$MANIFEST" Cargo.lock "$CHANGELOG"
          git commit --quiet -m "chore(godo): release $version"
          git tag --force "$GITHUB_REF_NAME"
          git push origin main
          git push --force origin "refs/tags/$GITHUB_REF_NAME"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  # Everything CI runs, once, on the commit being released.
  check:
    needs: prepare
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: "1.98.1"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install real-check
        run: cargo install --locked --git https://github.com/maytech-labs/real-check --tag v0.1.1 real-check
      - run: cargo xtask check

  build:
    name: build (${{ matrix.target }})
    needs: prepare
    strategy:
      fail-fast: true
      matrix:
        include:
          - { os: macos-15, target: aarch64-apple-darwin }
          - { os: macos-15, target: x86_64-apple-darwin, cross: true }
          - { os: ubuntu-24.04, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: "1.98.1"
          targets: ${{ matrix.target }}
      - name: Check the tag matches the crate's version
        shell: bash
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' "$MANIFEST" | head -1)
          if [ "godo-v$version" != "$TAG" ]; then
            echo "tag $TAG doesn't match $MANIFEST's version $version"
            exit 1
          fi
      # The tests on each platform; the full check runs once, in `check`.
      - run: cargo test --workspace --locked
      - run: cargo build --release --locked -p godo-cli --bin godo --target ${{ matrix.target }}
      - name: Smoke test
        if: ${{ !matrix.cross }}
        shell: bash
        run: |
          bin=target/${{ matrix.target }}/release/godo
          "$bin" --version
          dir=$(mktemp -d)
          mkdir "$dir/app"
          printf '[targets]\napp = "app"\n' > "$dir/godo.toml"
          printf 'hello: ## Say hello\n\t@echo hello from godo\n' > "$dir/app/Makefile"
          bin="$PWD/$bin"
          # Capture, then match: `grep -q` closing the pipe early would
          # kill the writer with SIGPIPE.
          list=$(cd "$dir" && "$bin" list -n app)
          echo "$list"
          grep "Say hello" <<< "$list"
          out=$(cd "$dir" && "$bin" hello app)
          echo "$out"
          [ "$out" = "hello from godo" ] || { echo "unexpected output from make"; exit 1; }
      - name: Package
        shell: bash
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          name="$TAG-${{ matrix.target }}"
          mkdir "$name"
          cp target/${{ matrix.target }}/release/godo LICENSE.md THIRD-PARTY-NOTICES.md "$name/"
          cp crates/godo/README.md crates/godo/CHANGELOG.md "$name/"
          tar -czf "$name.tar.gz" "$name"
          shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.target }}
          path: godo-v*.tar.gz*

  release:
    if: github.event_name == 'push'
    needs: [prepare, check, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Notes from the changelog
        run: |
          version="${GITHUB_REF_NAME#godo-v}"
          awk -v v="$version" '
            /^## / { if (found) exit; if (index($0, "## " v " ") == 1) { found = 1; next } }
            found { print }
          ' "$CHANGELOG" > notes.md
          test -s notes.md || { echo "no section for $version in $CHANGELOG"; exit 1; }
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "godo ${GITHUB_REF_NAME#godo-v}" --notes-file notes.md

  # Points Formula/godo.rb in maytech-labs/homebrew-tap at the new archives.
  # HOMEBREW_TAP_TOKEN is a fine-grained token with contents write on that repo
  # only.
  homebrew:
    if: github.event_name == 'push'
    needs: release
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: maytech-labs/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Bump the formula
        run: |
          formula=Formula/godo.rb
          version="${GITHUB_REF_NAME#godo-v}"  # brew reads the version from the urls
          base="https://github.com/maytech-labs/godo/releases/download/$GITHUB_REF_NAME"
          # Each archive's url line names its target; its sha256 follows it.
          for checksum in dist/*.tar.gz.sha256; do
            archive=$(basename "$checksum" .sha256)
            target=${archive#"$GITHUB_REF_NAME"-}
            target=${target%.tar.gz}
            sha=$(cut -d' ' -f1 "$checksum")
            awk -v t="-$target.tar.gz\"" -v url="$base/$archive" -v sha="$sha" '
              /^ *url / && index($0, t) { sub(/".*"/, "\"" url "\""); fix = 1; print; next }
              fix && /^ *sha256 / { sub(/".*"/, "\"" sha "\""); fix = 0 }
              { print }
            ' "$formula" > formula.tmp
            mv formula.tmp "$formula"
            grep -q "$sha" "$formula" || { echo "no url for $target in $formula"; exit 1; }
          done
          git diff --exit-code --quiet && { echo "formula already at $version"; exit 0; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore(godo): $version"
          git push
