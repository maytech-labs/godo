[package]
name = "godo-cli"
version = "0.1.1"
description = "make, but every run is a detachable, logged, watchable job"
homepage = "https://github.com/maytech-labs/godo/tree/main/crates/godo"
readme = "README.md"
keywords = ["make", "task-runner", "build", "monorepo", "cli"]
categories = ["command-line-utilities", "development-tools::build-utils"]
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "godo"
path = "src/main.rs"

[dependencies]
anstream = "1.0.0"
clap.workspace = true
clapsmith.workspace = true
libc = "0.2.191"
portable-pty = "0.9.0"
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
signal-hook = "0.4.6"
toml = { version = "1.1.8", features = ["preserve_order"] }
toml_edit = "0.25.18"
unicode-width = "0.2.3"
